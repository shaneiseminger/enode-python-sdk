[project]
name = "enode-python-sdk"
version = "0.1.0"
description = "Unofficial Python SDK for Enode.com"
readme = "README.md"
authors = [
    { name = "Shane Iseminger", email = "shane@shaneiseminger.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.7.2",
    "hatch>=1.17.1",
    "httpx>=0.28.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.20",
    "ty>=0.0.58",
]
